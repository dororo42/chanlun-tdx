name: Build TDX DLL

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        env:
          CARGO_TERM_COLOR: always

  build:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: chanlun_tdx_${{ matrix.target }}
          path: target/${{ matrix.target }}/release/chanlun_tdx.dll

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten and rename DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Copy-Item dist/chanlun_tdx_x86_64-pc-windows-msvc/chanlun_tdx.dll assets/chanlun_tdx_x64.dll
          Copy-Item dist/chanlun_tdx_i686-pc-windows-msvc/chanlun_tdx.dll assets/chanlun_tdx_x86.dll
      - uses: softprops/action-gh-release@v1
        with:
          files: assets/*.dll
